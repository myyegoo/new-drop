<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO DROP</title>
    <link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bakbak+One&family=Bebas+Neue&family=Exo+2:ital,wght@0,100..900;1,100..900&family=Fascinate+Inline&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header__container">
            <nav class="header__nav">
                <a href="cases.html"><img class="header__logo" src="PRO DROP.svg" alt="PRO DROP"></a>
                <ul class="header__list">
                    <li class="header__list-item">
                        <a class="header__list-link" href="cases.html">CASES</a>
                    </li>
                    <li>
                        <a class="header__list-link  active" href="upgrade.html">UPGRADE</a>
                    </li>
                </ul>
                <a class="header__button" href="/">Авторизоваться через Steam</a>
            </nav>
        </div>
    </header>
<main>
    <section class="upgrade">
        <div class="upgrade__container">
            <h1 class="upgrade__title">UPGRADE</h1>

            <div class="upgrade__top">
                <div class="upgrade__left">
                    <div class="toolbar">
                        <button class="tool" id="settingsBtn" type="button" title="Настройки"></button>
                        <button class="tool" id="soundBtn" type="button" title="Звук"></button>
                        <button class="tool" id="fastBtn" type="button" title="Быстрая прокрутка"></button>
                    </div>
                    <div class="panel panel--small">
                        <div class="skins is-empty" id="stake"></div>
                    </div>
                </div>

                <div class="upgrade__center">
                    <div class="wheel">
                        <svg class="wheel__svg" viewBox="0 0 240 240">
                            <defs>
                                <linearGradient id="wheelGradient" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0%" stop-color="#5CFFE8"/>
                                    <stop offset="100%" stop-color="#00A896"/>
                                </linearGradient>
                                <radialGradient id="wheelCore" cx="50%" cy="40%" r="70%">
                                    <stop offset="0%" stop-color="#2A2B32"/>
                                    <stop offset="100%" stop-color="#141519"/>
                                </radialGradient>
                            </defs>
                            <circle class="wheel__outer" cx="120" cy="120" r="116"/>
                            <circle class="wheel__ticks" cx="120" cy="120" r="106" pathLength="120"/>
                            <circle class="wheel__core" cx="120" cy="120" r="76" fill="url(#wheelCore)"/>
                            <circle class="wheel__track" cx="120" cy="120" r="90" pathLength="100"/>
                            <circle class="wheel__fill" id="wheelFill" cx="120" cy="120" r="90" pathLength="100"/>
                        </svg>
                        <div class="wheel__text">
                            <span class="wheel__label">ШАНС</span>
                            <span class="wheel__value"><span id="chanceValue">0</span>%</span>
                        </div>
                        <div class="wheel__arrow" id="wheelArrow"></div>
                    </div>
                </div>

                <div class="panel panel--small">
                    <div class="skins" id="target"></div>
                </div>
            </div>

            <div class="upgrade__action">
                <button class="upgrade__button" id="upgradeBtn" type="button" disabled>Улучшить</button>
                <div class="upgrade__result" id="result"></div>
            </div>

            <div class="upgrade__bottom">
                <div class="panel panel--big">
                    <div class="panel__head">
                        <h2 class="panel__title">Мой инвентарь</h2>
                    </div>
                    <div class="skins" id="inventory"></div>
                </div>

                <div class="panel panel--big">
                    <div class="panel__head">
                        <h2 class="panel__title">На что улучшить</h2>
                        <div class="mults" id="mults"></div>
                    </div>
                    <div class="skins" id="targets"></div>
                </div>
            </div>
        </div>
    </section>
</main>
<div class="modal" id="skinModal" hidden>
    <div class="modal__card" id="skinModalCard">
        <button class="modal__close" id="skinModalClose" type="button" aria-label="Закрыть">✕</button>
        <div class="modal__type" id="skinModalType"></div>
        <h2 class="modal__name" id="skinModalName"></h2>
        <img class="modal__image" id="skinModalImage" alt="">
        <div class="modal__price">
            <span id="skinModalPrice"></span>
            <span class="coin"></span>
        </div>
    </div>
</div>
<div class="modal" id="settingsModal" hidden>
    <div class="settings">
        <div class="settings__head">
            <h2 class="settings__title"><span id="settingsGear"></span> Настройки</h2>
            <button class="settings__close" id="settingsClose" type="button" aria-label="Закрыть">✕</button>
        </div>

        <div class="settings__body">
            <div class="settings__row">
                <h3 class="settings__h">Быстрый подбор</h3>
                <button class="settings__link" id="settingsDefault" type="button">По умолчанию</button>
            </div>

            <div class="settings__cards">
                <div class="settings__card">
                    <p>Настройте кнопки для быстрого подбора по коэффициенту</p>
                    <div class="settings__inputs">
                        <div class="settings__chips" id="multInputs"></div>
                        <button class="settings__reset" type="button" data-reset="mults" title="Сбросить"></button>
                    </div>
                </div>
                <div class="settings__card">
                    <p>Настройте кнопки для быстрого подбора по проценту</p>
                    <div class="settings__inputs">
                        <div class="settings__chips" id="pctInputs"></div>
                        <button class="settings__reset" type="button" data-reset="pcts" title="Сбросить"></button>
                    </div>
                </div>
            </div>

            <div class="settings__group">
                <h3 class="settings__h">Звук в апгрейде</h3>
                <label class="radio">
                    <input type="radio" name="sound" value="on">
                    <span>
                        <b>Включен</b>
                        <small>Значение по умолчанию. Звуковые эффекты (нажатия кнопок, щелчки анимации и финальные овации) включены</small>
                    </span>
                </label>
                <label class="radio">
                    <input type="radio" name="sound" value="off">
                    <span>
                        <b>Выключен</b>
                        <small>Звуковые эффекты в апгрейде теперь в беззвучном режиме</small>
                    </span>
                </label>
            </div>

            <div class="settings__group">
                <h3 class="settings__h">Тип прокрутки</h3>
                <label class="radio">
                    <input type="radio" name="speed" value="normal">
                    <span>
                        <b>Обычная</b>
                        <small>Значение по умолчанию. Стрелка крутится медленно</small>
                    </span>
                </label>
                <label class="radio">
                    <input type="radio" name="speed" value="fast">
                    <span>
                        <b>Ускоренная</b>
                        <small>Стрелка крутится более быстро, чтобы ускорить процесс игры</small>
                    </span>
                </label>
            </div>

            <button class="settings__save" id="settingsSave" type="button">Сохранить и закрыть</button>
        </div>
    </div>
</div>
    <script src="upgrade.js" defer></script>
</body>
</html>
